[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "../node_modules"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/", "forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 32
fail_on_revert = false
